<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#111111"/>

  <!-- Play triangle (video) -->
  <polygon points="100,120 100,392 340,256" fill="#2a2a2a"/>

  <!-- Origin dot -->
  <circle cx="220" cy="256" r="18" fill="#ffffff"/>

  <!-- Arrow E (horizontal) -->
  <line x1="238" y1="256" x2="360" y2="256" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <polygon points="356,232 406,256 356,280" fill="#ffffff"/>

  <!-- Arrow NE (rotated -45° around origin) -->
  <line x1="238" y1="256" x2="360" y2="256" stroke="#ffffff" stroke-width="22" stroke-linecap="round" transform="rotate(-45, 220, 256)"/>
  <polygon points="356,232 406,256 356,280" fill="#ffffff" transform="rotate(-45, 220, 256)"/>

  <!-- Arrow SE (rotated +45° around origin) -->
  <line x1="238" y1="256" x2="360" y2="256" stroke="#ffffff" stroke-width="22" stroke-linecap="round" transform="rotate(45, 220, 256)"/>
  <polygon points="356,232 406,256 356,280" fill="#ffffff" transform="rotate(45, 220, 256)"/>
</svg>
